[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timecs"
version = "3.0.3"
description = "Deterministic AST Security Scanner, Proof Graph Engine & Automated Remediation Framework"
readme = "INSTRUCTIONS_OF_TIMECS.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.21",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
js = ["tree-sitter-javascript", "tree-sitter-typescript"]

[project.scripts]
timecs = "cli:main"
timecode = "cli:main"
tcsec = "cli:main"

[tool.setuptools]
py-modules = ["ast_scanner","banner","ci_reporter","cli","cross_file_engine","diff_scan","function_summarizer","html_auditor","iac_auditor","js_scanner","master_rules_bank","rule_engine","sarif_adapter","sarif_exporter","secret_scanner","suppression_resolver","symbol_indexer","tcs_config"]
packages = ["remediation","scanners","tcs","tcs.analysis"]

[tool.pytest.ini_options]
testpaths = ["scratch"]
norecursedirs = [".git",".venv","build","dist","node_modules","__pycache__",".*"]
